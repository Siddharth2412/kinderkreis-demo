server {
    # Matches Vite's own dev-server port so the docker-compose host port
    # mapping (3000:5173) stays identical between the prod base file and the
    # dev override — Compose concatenates (rather than replaces) list fields
    # like `ports:` across override files, so reusing the same mapping means
    # the dev override never needs to touch it at all.
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Certificate uploads go up to 5MB (see README) — nginx's 1MB default
    # would reject those with a 413 before they ever reach the backend.
    client_max_body_size 10M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Reverse-proxy the API to the backend container over Docker's internal
    # network, so the browser only ever talks to this same origin (no
    # separate port to open on the VM/cloud firewall, no CORS). 127.0.0.11
    # is Docker's embedded DNS — resolving `backend` through it per-request
    # (via a variable, not a bare proxy_pass) means this keeps working even
    # if the backend container gets recreated with a new internal IP.
    resolver 127.0.0.11 valid=10s;
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite fingerprints built assets (e.g. main.a1b2c3.js), so they're safe to
    # cache aggressively — a new deploy ships new filenames.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html itself must always be revalidated, or browsers/CDNs could
    # keep serving an old app shell that references assets that no longer
    # exist after a redeploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # No client-side router today (view switching is in-memory React state,
    # not URL-based), but falling back to index.html for unknown paths is a
    # harmless safety net and costs nothing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
