# Production compose file: builds the frontend's `production` stage
# (static bundle served by nginx:alpine) instead of the Vite dev server, and
# runs the backend without the live-source bind mount. See README.md
# "Deploying to production" for the reasoning.
#
# Usage (also see .github/workflows/deploy.yml, which runs this on every
# push to main via a self-hosted runner on the VM):
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml up -d
#
# Requires a `.env` file next to this one (see .env.example).
services:
  backend:
    build: ./backend
    container_name: kinderkreis-backend
    ports:
      # Loopback-only: the backend is never reached directly from the
      # internet — nginx (the frontend container) reverse-proxies /api/ to
      # it over the internal Docker network (see frontend/nginx.conf). This
      # binding just lets you `ssh -L 8000:localhost:8000` in for debugging
      # (e.g. hitting /docs) without opening a port on the VM/cloud firewall.
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      # Named volume, not a bind mount: survives `docker compose build` +
      # `up -d` recreating the container on every deploy (only `down -v` or
      # `docker volume rm` would remove it). /app/app/data is where db.py's
      # DEFAULT_DB_PATH and CERTIFICATES_DIR resolve to inside the image
      # (WORKDIR /app, `COPY app ./app`) — without this mount, the SQLite
      # DB and uploaded certificates lived in the old container's writable
      # layer and vanished the moment that container was replaced.
      - backend_data:/app/app/data
    mem_limit: 300m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        # Empty on purpose: nginx proxies /api/ to the backend on the same
        # origin (see frontend/nginx.conf), so the browser calls relative
        # paths — no separate host:port to bake in, no CORS. See api.js.
        VITE_API_URL: ""
    container_name: kinderkreis-frontend
    ports:
      - "80:5173"
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 100m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  backend_data:
