services:
  backend:
    build: ./backend
    container_name: kinderkreis-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: kinderkreis-frontend
    environment:
      - VITE_API_URL=http://localhost:8000
    ports:
      - "3000:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    depends_on:
      - backend
    restart: unless-stopped
