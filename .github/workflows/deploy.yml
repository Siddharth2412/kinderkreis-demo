name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: [self-hosted, linux, kinderkreis-prod]
    concurrency:
      group: ci-test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Run backend tests
        working-directory: backend
        run: pytest

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, kinderkreis-prod]
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      # Written fresh on every deploy from GitHub Secrets rather than kept
      # as a standing file on the VM, so rotating a secret in GitHub is
      # enough — nothing to remember to update on the box itself.
      - name: Write .env
        run: |
          cat > .env <<EOF
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_PORT=${{ secrets.SMTP_PORT }}
          SMTP_USERNAME=${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          FROM_EMAIL=${{ secrets.FROM_EMAIL }}
          FROM_NAME=${{ secrets.FROM_NAME }}
          ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS }}
          ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
          EOF

      - name: Build images
        run: docker compose -f docker-compose.prod.yml build

      - name: Deploy
        run: docker compose -f docker-compose.prod.yml up -d --remove-orphans

      - name: Wait for health checks
        run: |
          for i in $(seq 1 15); do
            backend_ok=$(docker inspect -f '{{.State.Health.Status}}' kinderkreis-backend 2>/dev/null || echo "starting")
            frontend_ok=$(docker inspect -f '{{.State.Health.Status}}' kinderkreis-frontend 2>/dev/null || echo "starting")
            echo "backend=$backend_ok frontend=$frontend_ok"
            if [ "$backend_ok" = "healthy" ] && [ "$frontend_ok" = "healthy" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Containers did not become healthy in time"
          docker compose -f docker-compose.prod.yml logs --tail=50
          exit 1

      - name: Clean up old images
        if: always()
        run: docker image prune -f
